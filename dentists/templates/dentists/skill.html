{% extends 'main.html' %}
{% load static %}
{% block content %}

<section style="padding: 3rem 0;">
    <div class="container">
        <div class="layout" style="align-items:flex-start; gap:2rem;">

            <!-- LEFT COLUMN: Image -->
            <div class="column column--1of3" style="padding-top:0;">
                <div class="card">
                    <img style="width:100%; height:20rem; object-fit:cover; display:block;"
                         src="{% if single_skill.skill_image %}{{ single_skill.skill_image.url }}{% else %}{% static 'media/default.jpg' %}{% endif %}"
                         alt="skill thumbnail" />
                </div>
            </div>

            <!-- RIGHT COLUMN: Info -->
            <div class="column column--2of3">
                <div class="card">
                    <div class="card__header">
                        <h5 class="card__headerTitle">{{ single_skill.name }}</h5>
                    </div>
                    <div class="card__body">
                        <h3 style="font-size:1.6rem; color:var(--color-sub-light); margin-bottom:1rem;">
                            What is the {{ single_skill.name }} skill all about?
                        </h3>
                        <p style="font-size:1.4rem; color:var(--color-text); line-height:1.8; margin-top:0.5rem;">
                            {{ single_skill.description }}
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

{% endblock %}
