{% extends 'main.html' %}
{% load static %}
{% block content %}

<div class="container">
    <div class="auth">
        <div class="column card">
            <div class="card__body">

                <div class="auth__header">
                    <a href="/">
                        <img src="{% static 'media/icon.svg' %}" alt="icon" />
                    </a>
                    <h3 class="auth__title">Set New Password</h3>
                    <p class="auth__subtitle">Enter your new password below.</p>
                </div>

                <form method="POST" class="form auth__form">
                    {% csrf_token %}

                    {% for field in form %}
                    <div class="form__field">
                        {{ field.label_tag }}
                        {{ field }}
                        {% for error in field.errors %}
                        <p class="form__error">{{ error }}</p>
                        {% endfor %}
                    </div>
                    {% endfor %}

                    <div class="auth__actions">
                        <input class="btn btn--sub btn--lg" type="submit" value="Set New Password" />
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock content %}
