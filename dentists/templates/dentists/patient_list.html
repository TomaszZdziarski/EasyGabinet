{% extends 'main.html' %}
{% load static %}
{% block content %}

<section class="clinic-patient-list">
    <div class="container container--full clinic-patient-list__container">

        <div class="card">
            <div class="card__header">
                <h5 class="card__headerTitle">Patients</h5>
            </div>
        </div>

        {% for patient in patients %}
        <div class="card">
            <div class="card__body clinic-patient-list__row">
                <div class="clinic-patient-list__info">
                    <p class="clinic-patient-list__name">{{ patient.user.get_full_name }}</p>
                    <p class="clinic-patient-list__dob">DOB: {{ patient.date_of_birth }}</p>
                </div>
                <a href="{% url 'patient-history' patient.id %}" class="btn btn--main btn--md">View History</a>
            </div>
        </div>
        {% empty %}
        <div class="card">
            <div class="card__body">
                <p class="clinic-patient-list__empty">No patients found.</p>
            </div>
        </div>
        {% endfor %}

    </div>
</section>

{% endblock %}
