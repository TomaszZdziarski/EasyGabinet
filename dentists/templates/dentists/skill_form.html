{% extends 'main.html' %}
{% load static %}
{% block content %}


<div class="container">
    <div class="auth">
        <div class="card">
            <div class="card__body">


            <a class="backButton" href="{% url 'account' %}"><i class="im im-angle-left"></i>Back</a>
            <br>

            <form class="form" method="POST" enctype="multipart/form-data">

                {% csrf_token %}
                {% for field in form %}
                <div class="form__field">
                    {{ field.label_tag }}
                    {{ field }}
                </div>

                {% endfor %}

                <input class="btn btn--sub btn--lg  my-md" type="submit" value="Submit" />
            </form>
        </div>
    </div>
    </div>
</div>

{% endblock %}
