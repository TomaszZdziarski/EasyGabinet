{% extends 'main.html' %}
{% load static %}
{% block content%}

<div class="container">
    <div class="auth">
        <div class="card">
            <div class="card__body">
                <div class="auth__header text-center" style="margin-bottom: 1.5rem;">
                    <a href="/">
                        <img src="{% static 'media/icon.svg' %}" alt="icon" />
                    </a>
                    <h3>Register new patient</h3>

                </div>

                <form method="POST" action="{% url 'patient-register' %}" class="form auth__form">
                    {% csrf_token %}
                    {% for field in user_form %}
                    <div class="form__field">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                        <p style="color:red;">{{ error }}</p>
                        {% endfor %}
                    </div>
                    {% endfor %}



                    <div class="auth__actions">
                        <input class="btn btn--sub btn--lg" type="submit" value="Register" />
                    </div>
                </form>

                <div class="auth__alternative" style="margin-top: 2rem; text-align: center; padding-bottom: 1rem;">
                    <p style="color: var(--color-gray); font-size: 1rem; margin-bottom: 0.5rem;">Already have an Account?</p>
                    <a href="{% url 'patient-login' %}" class="btn btn--sub--outline btn--md" style="margin-right:0; font-size:1rem;">Log In as patient</a>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock content %}
