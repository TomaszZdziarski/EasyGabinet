{% extends 'main.html' %}

{% block content %}

<div class="container">
        <div class="auth">
            <div class="card">
                <div class="card__body">

                        <a class="backButton" href="{% url 'patient-account' patient_id=patient.id %}"><i class="im im-angle-left"></i></a>
                        <br>

                        <form class="form" method="POST" action="{% url 'patient-account-edit' patient_id=patient.id %}" enctype="multipart/form-data">
                            {% csrf_token %}
                            {{ form.as_p }}

                            <!-- Input:Text -->
                            <div class="form__field">

                                {{ field.label_tag }}
                                {{ field }}

                            </div>


                            <input class="btn btn--sub btn--lg  my-md" type="submit" value="Submit" />
                        </form>

                </div>
            </div>
        </div>
</div>

{% endblock %}
