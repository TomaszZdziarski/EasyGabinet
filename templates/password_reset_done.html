{% extends 'main.html' %}
{% load static %}
{% block content %}

<div class="container">
    <div class="auth">
        <div class="card">
            <div class="card__body">

                <div class="auth__header">
                    <a href="/">
                        <img src="{% static 'media/icon.svg' %}" alt="icon" />
                    </a>
                    <h3 class="auth__title">Check your Email</h3>
                    <p class="auth__subtitle">We've sent a password reset link to your email address. Please check your inbox.</p>
                </div>

                <div class="auth__alternative">
                    <p class="auth__alternative-text">Didn't receive an email?</p>
                    <a href="{% url 'patients-password-reset' %}" class="btn btn--sub--outline btn--md">Try again</a>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock content %}
