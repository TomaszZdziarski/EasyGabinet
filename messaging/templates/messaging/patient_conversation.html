{% extends 'main.html' %}
{% load static %}
{% block content %}

<div style="display:flex; justify-content:center; padding:2rem;">
    <div class="card" style="max-width:650px; width:100%;">

        <div class="card__header" style="padding:1.5rem 2rem; border-bottom:1.5px solid var(--color-light);">
            <h4 class="card__headerTitle" style="color:var(--color-sub);">Dr. {{ dentist }}</h4>
        </div>

        <div class="card__body" style="padding:1.5rem 2rem;">

            <!-- Thread -->
            <div style="display:flex; flex-direction:column; gap:1rem; margin-bottom:2rem; max-height:450px; overflow-y:auto;">
                {% for message in thread %}
                <div style="display:flex; {% if message.sender == 'patient' %}justify-content:flex-end{% else %}justify-content:flex-start{% endif %};">
                    <div style="
                        max-width:75%;
                        padding:1rem 1.4rem;
                        border-radius:1rem;
                        font-size:1.3rem;
                        line-height:1.5;
                        {% if message.sender == 'patient' %}
                            background:var(--color-main);
                            color:white;
                            border-bottom-right-radius:0.2rem;
                        {% else %}
                            background:var(--color-main-light);
                            color:var(--color-sub);
                            border-bottom-left-radius:0.2rem;
                        {% endif %}
                    ">
                        <p>{{ message.body }}</p>
                        <p style="font-size:1.1rem; margin-top:0.4rem; opacity:0.7; text-align:right;">
                            {{ message.sent_at|date:"d M, H:i" }}
                        </p>
                    </div>
                </div>
                {% empty %}
                <p style="color:var(--color-text); text-align:center;">No messages yet. Say hello!</p>
                {% endfor %}
            </div>

            <!-- Reply form -->
            <form method="POST" style="border-top:1.5px solid var(--color-light); padding-top:1.5rem;">
                {% csrf_token %}
                <div class="form__field" style="margin-bottom:1.5rem;">
                    <textarea
                            name="body"
                            rows="4"
                            placeholder="Write your reply..."
                            style="width:100%; padding:1rem; border:1.5px solid var(--color-light); border-radius:0.5rem; font-size:1.4rem; color:var(--color-text); resize:vertical; outline:none; box-sizing:border-box;"
                    ></textarea>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <a href="{% url 'patient-inbox' %}" class="btn btn--sub--outline">← Back to Inbox</a>
                    <button type="submit" class="btn btn--main">Send</button>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}
