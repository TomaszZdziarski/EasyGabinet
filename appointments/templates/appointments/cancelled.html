{% extends 'main.html' %}

{% block content %}
<div class="container">
    <div class="auth">
        <div class="card">
            <div class="card__body">
                <div class="auth__header">
                    <div class="clinic-status__icon">❌</div>
                    <h3 class="auth__title">Appointment Cancelled</h3>
                    <p class="auth__subtitle">Your appointment has been cancelled. If this was a mistake or you'd like to book again, use the button below.</p>
                </div>
                <div class="auth__actions">
                    <a href="{% url 'calendar_no_dentist' %}" class="btn btn--sub--outline btn--md">Book a New Appointment</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
