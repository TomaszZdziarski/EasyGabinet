{% extends "main.html" %}

{% block content %}

<div class="container">
    <div class="auth">
        <div class="card">
            <div class="card__body">

                <div class="auth__header">
                    <h3 class="auth__title">Delete Appointment</h3>
                    <p class="auth__subtitle">This action cannot be undone.</p>
                </div>

                <form method="POST" action="" class="form auth__form">
                    {% csrf_token %}

                    <div class="form__field">
                        <p>Are you sure you want to delete <strong>{{ appointment }}</strong>?</p>
                    </div>

                    <div class="auth__actions">
                        <a href="{{ request.GET.next }}" class="btn btn--sub--outline btn--md">Go Back</a>
                        <input class="btn btn--main btn--md" type="submit" value="Confirm Delete" />
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock content %}
