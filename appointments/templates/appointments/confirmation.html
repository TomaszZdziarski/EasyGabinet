{% extends 'main.html' %}
{% load static %}
{% block content %}

<div class="container">
    <div class="auth">
        <div class="card">
            <div class="card__body">

                <div class="auth__header text-center">
                    <a href="/">
                        <img src="{% static 'media/icon.svg' %}" alt="icon" />
                    </a>
                    <h3>Appointment Confirmed!</h3>
                    <p>Your appointment has been successfully booked. Thank you for using our service!</p>
                </div>

                <div class="auth__actions" style="flex-direction: column; gap: 0.75rem; margin-top: 1.5rem;">

                    <a class="btn btn--sub--outline btn--md" style="margin-right:0; font-size:1.1rem; line-height:1;" href="{% url 'patient-account' patient.id %}">&larr; Go back</a>

                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
